<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="">
  <defs>
    <linearGradient id="fh-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d07"/>
      <stop offset="0.5" stop-color="#2b1408"/>
      <stop offset="1" stop-color="#0b0705"/>
    </linearGradient>
    <radialGradient id="fh-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fh-rose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fh-dial" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3a1c09" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#110905" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="fh-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="fh-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="fh-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="fh-vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <rect width="880" height="760" fill="url(#fh-base)"/>
  <rect width="880" height="760" fill="url(#fh-grid)"/>
  <ellipse cx="470" cy="285" rx="430" ry="380" fill="url(#fh-warm)"/>
  <ellipse cx="150" cy="620" rx="330" ry="300" fill="url(#fh-rose)"/>

  <!-- Urgency rings -->
  <g fill="none" stroke="#ffffff">
    <circle cx="440" cy="315" r="238" stroke-opacity="0.07" stroke-width="1.5"/>
    <circle cx="440" cy="315" r="292" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="440" cy="315" r="348" stroke-opacity="0.03" stroke-width="1.5"/>
  </g>

  <!-- Dial -->
  <circle cx="440" cy="315" r="196" fill="none" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="440" cy="315" r="170" fill="url(#fh-dial)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Sixty minute ticks, drawn as one dashed ring -->
  <circle cx="440" cy="315" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.32"
          stroke-width="12" pathLength="60" stroke-dasharray="0.28 0.72" stroke-linecap="butt"/>
  <!-- Quarter markers, brighter -->
  <circle cx="440" cy="315" r="150" fill="none" stroke="#fde68a" stroke-opacity="0.85"
          stroke-width="18" pathLength="12" stroke-dasharray="0.22 2.78" transform="rotate(-90 440 315)"/>

  <!-- The hour that matters, swept out of the dial edge -->
  <circle cx="440" cy="315" r="170" fill="none" stroke="url(#fh-sweep)" stroke-width="7"
          stroke-linecap="round" pathLength="1" stroke-dasharray="0.34 1" transform="rotate(-90 440 315)"/>

  <!-- Hands -->
  <g stroke-linecap="round">
    <line x1="440" y1="315" x2="440" y2="192" stroke="#ffffff" stroke-opacity="0.92" stroke-width="8"/>
    <line x1="440" y1="315" x2="536" y2="368" stroke="#fbbf24" stroke-width="9"/>
    <line x1="440" y1="315" x2="382" y2="420" stroke="#fb7185" stroke-opacity="0.75" stroke-width="3"/>
  </g>
  <circle cx="440" cy="315" r="13" fill="#0b0705" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="440" cy="315" r="4" fill="#fde68a"/>

  <rect width="880" height="760" filter="url(#fh-grain)" opacity="0.11" style="mix-blend-mode:overlay"/>
  <rect width="880" height="760" fill="url(#fh-vignette)"/>
</svg>
