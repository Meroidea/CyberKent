<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="">
  <defs>
    <linearGradient id="ps-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04202b"/>
      <stop offset="0.5" stop-color="#062b3c"/>
      <stop offset="1" stop-color="#05090f"/>
    </linearGradient>
    <radialGradient id="ps-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ps-teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ps-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3a4c" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#05121a" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="ps-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="ps-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="ps-vignette" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </radialGradient>
  </defs>

  <rect width="880" height="760" fill="url(#ps-base)"/>
  <rect width="880" height="760" fill="url(#ps-grid)"/>
  <ellipse cx="440" cy="300" rx="430" ry="370" fill="url(#ps-cyan)"/>
  <ellipse cx="760" cy="640" rx="330" ry="300" fill="url(#ps-teal)"/>

  <!-- The call arriving, drawn as waves off the handset -->
  <g fill="none" stroke="#67e8f9" stroke-linecap="round">
    <path d="M566 214 A 150 150 0 0 1 566 448" stroke-opacity="0.55" stroke-width="5"/>
    <path d="M602 178 A 200 200 0 0 1 602 484" stroke-opacity="0.32" stroke-width="5"/>
    <path d="M638 142 A 250 250 0 0 1 638 520" stroke-opacity="0.16" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#5eead4" stroke-linecap="round">
    <path d="M314 214 A 150 150 0 0 0 314 448" stroke-opacity="0.3" stroke-width="4"/>
    <path d="M278 178 A 200 200 0 0 0 278 484" stroke-opacity="0.16" stroke-width="4"/>
  </g>

  <!-- Handset -->
  <g transform="rotate(-6 440 340)">
    <rect x="366" y="150" width="156" height="326" rx="30" fill="#000000" fill-opacity="0.4"/>
    <rect x="358" y="142" width="156" height="326" rx="30" fill="url(#ps-glass)"
          stroke="#ffffff" stroke-opacity="0.2" stroke-width="2.5"/>
    <rect x="410" y="156" width="52" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>

    <!-- Unknown caller -->
    <circle cx="436" cy="228" r="30" fill="#083344" stroke="#67e8f9" stroke-opacity="0.6" stroke-width="2"/>
    <text x="436" y="240" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="26" font-weight="700" fill="#a5f3fc" fill-opacity="0.85">?</text>

    <text x="436" y="292" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="15" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.78">UNKNOWN</text>
    <text x="436" y="316" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="12" letter-spacing="2" fill="#67e8f9" fill-opacity="0.7">CALLING…</text>

    <!-- Decline / answer -->
    <circle cx="398" cy="410" r="26" fill="#3f0d1b" stroke="#fb7185" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M389 419 L407 401" stroke="#fda4af" stroke-width="5" stroke-linecap="round"/>
    <path d="M389 401 L407 419" stroke="#fda4af" stroke-width="5" stroke-linecap="round"/>
    <circle cx="474" cy="410" r="26" fill="#052e22" stroke="#34d399" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M464 399 a34 34 0 0 0 21 21"
          fill="none" stroke="#6ee7b7" stroke-opacity="0.9" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Two people talking it through -->
  <g transform="translate(178 214)">
    <path d="M0 0 h150 a18 18 0 0 1 18 18 v66 a18 18 0 0 1 -18 18 h-108 l-30 28 v-28 h-12 a18 18 0 0 1 -18 -18 v-66 a18 18 0 0 1 18 -18 z"
          fill="#062b3c" fill-opacity="0.9" stroke="#5eead4" stroke-opacity="0.45" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="22" y="30" width="112" height="9" rx="4.5" fill-opacity="0.3"/>
      <rect x="22" y="52" width="80" height="9" rx="4.5" fill-opacity="0.18"/>
    </g>
  </g>
  <g transform="translate(548 436)">
    <path d="M168 0 h-150 a18 18 0 0 0 -18 18 v66 a18 18 0 0 0 18 18 h108 l30 28 v-28 h12 a18 18 0 0 0 18 -18 v-66 a18 18 0 0 0 -18 -18 z"
          fill="#062b3c" fill-opacity="0.9" stroke="#67e8f9" stroke-opacity="0.4" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="34" y="30" width="112" height="9" rx="4.5" fill-opacity="0.26"/>
      <rect x="66" y="52" width="80" height="9" rx="4.5" fill-opacity="0.16"/>
    </g>
  </g>

  <rect width="880" height="760" filter="url(#ps-grain)" opacity="0.11" style="mix-blend-mode:overlay"/>
  <rect width="880" height="760" fill="url(#ps-vignette)"/>
</svg>
