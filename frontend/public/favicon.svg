<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CyberKent">
  <!--
    The CyberKent mark on the site's own page colour, drawn as an app tile so
    it keeps its shape in a tab strip at 16px, where a transparent two-blade
    mark goes to noise. Geometry and shading match
    src/components/brand/markGeometry.ts and MarkBody.tsx — one blade drawn
    twice, the second turned a half turn about the centre, lit by one key light
    from above. Colours are the dark theme's, because the tile is dark.
  -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <g transform="translate(18.27 10.88) scale(0.4224)">
<defs>
    <path id="f-blade" d="M32.43 0C38.25 6.84 64.94 36.55 64.94 43.16C64.94 57.77 55.25 61.44 43.16 70.78C41.25 68.48 32.63 59.71 32.63 56.97C32.63 52.68 43.09 48.39 43.09 44.91C43.09 39.13 24.99 28.01 24.99 13.81C24.99 5.01 29.81 3.49 32.43 0Z"/>
    <path id="f-facet" d="M32.8 58.3Q46.1 63.15 59.4 57.4L72 96 20 96Z"/>
    <path id="f-crease" d="M32.8 58.3Q46.1 63.15 59.4 57.4" fill="none"/>
    <clipPath id="f-clip-upper"><use href="#f-blade"/></clipPath>
    <clipPath id="f-clip-lower"><use href="#f-blade" transform="rotate(180 32.5 50)"/></clipPath>
    <linearGradient id="f-base-upper" x1="0.12" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/><stop offset="0.38" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="f-sheen-upper" x1="0" y1="0.25" x2="1" y2="0.75">
      <stop offset="0.45" stop-color="#a5f3fc" stop-opacity="0"/><stop offset="1" stop-color="#a5f3fc" stop-opacity="0.95"/></linearGradient>
    <linearGradient id="f-ao-upper" x1="1" y1="0.8" x2="0" y2="0.2">
      <stop offset="0.4" stop-color="#0e7490" stop-opacity="0"/><stop offset="1" stop-color="#0e7490" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="f-facet-upper" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1b6b83"/><stop offset="1" stop-color="#0d4a5c"/></linearGradient>
    <linearGradient id="f-base-lower" x1="0.12" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/><stop offset="0.38" stop-color="#6366f1"/><stop offset="1" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="f-sheen-lower" x1="0" y1="0.25" x2="1" y2="0.75">
      <stop offset="0.45" stop-color="#a5b4fc" stop-opacity="0"/><stop offset="1" stop-color="#a5b4fc" stop-opacity="0.95"/></linearGradient>
    <linearGradient id="f-ao-lower" x1="1" y1="0.8" x2="0" y2="0.2">
      <stop offset="0.4" stop-color="#3730a3" stop-opacity="0"/><stop offset="1" stop-color="#3730a3" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="f-facet-lower" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#dbe1ff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <filter id="f-soften" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="f-cast" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2.6" stdDeviation="2.6" flood-color="#000000" flood-opacity="0.55"/></filter>
  </defs>
  <g filter="url(#f-cast)">
    <g clip-path="url(#f-clip-lower)">
      <use href="#f-blade" transform="rotate(180 32.5 50)" fill="url(#f-base-lower)"/>
      <use href="#f-facet" transform="rotate(180 32.5 50)" fill="url(#f-facet-lower)"/>
      <use href="#f-blade" transform="rotate(180 32.5 50)" fill="none" stroke="url(#f-ao-lower)" stroke-width="11" filter="url(#f-soften)"/>
      <use href="#f-blade" transform="rotate(180 32.5 50)" fill="none" stroke="url(#f-sheen-lower)" stroke-width="7" filter="url(#f-soften)"/>
      <use href="#f-crease" transform="rotate(180 32.5 50)" stroke="#eef2ff" stroke-opacity="0.9" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <g clip-path="url(#f-clip-upper)">
      <use href="#f-blade" fill="url(#f-base-upper)"/>
      <use href="#f-facet" fill="url(#f-facet-upper)"/>
      <use href="#f-blade" fill="none" stroke="url(#f-ao-upper)" stroke-width="11" filter="url(#f-soften)"/>
      <use href="#f-blade" fill="none" stroke="url(#f-sheen-upper)" stroke-width="7" filter="url(#f-soften)"/>
      <use href="#f-crease" stroke="#0b3f4e" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </g>
  </g>
</svg>
