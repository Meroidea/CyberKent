<!doctype html>
<html lang="en-AU" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <title>CyberKent — Hume City Council CyberSafe Services</title>
    <meta
      name="description"
      content="Check a suspicious message, link, phone number or email, report a scam to Hume City Council, and follow community scam alerts across the municipality."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2 4 7v8c0 7.4 5.1 13.3 12 15 6.9-1.7 12-7.6 12-15V7z' fill='url(%23g)'/%3E%3Cpath d='m11 16 3.5 3.5L21 13' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong scheme. Mirrors the logic in src/theme/ThemeProvider.tsx.
      (function () {
        try {
          var stored = window.localStorage.getItem("cyberkent-theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var resolved = stored === "light" || stored === "dark" ? stored : system;
          document.documentElement.classList.toggle("dark", resolved === "dark");
        } catch (error) {
          void error; // Storage can be blocked; the dark default in <html> stands.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
