<!doctype html>
<html lang="en-AU" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <title>CyberKent — Hume City Council CyberSafe Services</title>
    <meta
      name="description"
      content="Check a suspicious message, link, phone number or email, report a scam to Hume City Council, and follow community scam alerts across the municipality."
    />
    <!--
      Icons. The SVG is the one every current browser prefers; the .ico carries
      16/32/48/64 for the ones that do not, and the Apple icon is full bleed
      because iOS applies its own mask over whatever it is handed.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="CyberKent" />

    <!--
      Share card.

      The origin below is written out in full three times rather than left
      relative, because a share crawler resolves a relative URL against its own
      host and drops the card. It is the deployment's own production domain —
      the Vercel project `cyber-kent` serves this app there — and the only
      absolute address anywhere in the app, so it is the one thing to change
      when the service moves onto its Council address. Search this file for
      `og:url` and the three lines are together.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CyberKent" />
    <meta property="og:title" content="CyberKent — Hume City Council CyberSafe Services" />
    <meta
      property="og:description"
      content="Check a suspicious message, link, phone number or email, report a scam to Hume City Council, and follow community scam alerts across the municipality."
    />
    <meta property="og:url" content="https://cyber-kent.vercel.app/" />
    <meta property="og:image" content="https://cyber-kent.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The CyberKent mark beside the wordmark, over the service's three entry points: scam checker, report to Council, community alerts."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CyberKent — Hume City Council CyberSafe Services" />
    <meta
      name="twitter:description"
      content="Check a suspicious message, report a scam to Council, and follow verified community alerts across Hume."
    />
    <meta name="twitter:image" content="https://cyber-kent.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong scheme. Mirrors the logic in src/theme/ThemeProvider.tsx.
      (function () {
        try {
          var stored = window.localStorage.getItem("cyberkent-theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var resolved = stored === "light" || stored === "dark" ? stored : system;
          document.documentElement.classList.toggle("dark", resolved === "dark");
        } catch (error) {
          void error; // Storage can be blocked; the dark default in <html> stands.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
